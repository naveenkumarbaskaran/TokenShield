[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenshield"
version = "0.2.0"
description = "LLM token cost monitoring, budget enforcement, and optimization."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Naveen Kumar Baskaran"}]
keywords = ["llm", "tokens", "cost", "budget", "monitoring", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
